# Estilo CHIBI global.
#
# Este arquivo define a linguagem visual COMPARTILHADA por todas as
# personagens. E o eixo "estilo" — ortogonal ao eixo "identidade"
# (characters/<id>/) e ao eixo "pose" (pose_bank/).
#
# Regra critica de identidade: o bloco de prompt abaixo descreve APENAS estilo
# e enquadramento. Ele NUNCA deve descrever rosto, cabelo, cor de olho, roupa
# ou acessorio — isso compete com as imagens de referencia e causa drift.

schema_version: 1
name: chibi
version: v0

# ---------------------------------------------------------------------------
# MODELO BASE — resolvido via config/models.lock.yaml
# ---------------------------------------------------------------------------
model:
  key: qwen_image_edit_2511
  # [TEST REQUIRED] modelo ainda nao verificado. Ver LICENSES.md.

lora:
  enabled: false          # spec §16: NAO treinar Style LoRA no MVP
  key: null
  weight: 0.8

# ---------------------------------------------------------------------------
# PROMPT DE ESTILO
# Preencher durante a FASE 3, com base no que empiricamente funcionar.
# Deixado vazio de proposito: inventar prompt agora seria especulacao.
# ---------------------------------------------------------------------------
prompt:
  style_block: ""         # [TEST REQUIRED]
  negative_block: ""      # [TEST REQUIRED]

# ---------------------------------------------------------------------------
# PARAMETROS TRAVADOS
# Uma vez que uma combinacao funcionar, ela e travada aqui para que todas as
# personagens compartilhem as mesmas condicoes de geracao.
# ---------------------------------------------------------------------------
sampling:
  steps: null             # [TEST REQUIRED]
  cfg: null               # [TEST REQUIRED]
  sampler: null
  scheduler: null

# ---------------------------------------------------------------------------
# CONVENCOES DE CANVAS DO MASTER
# Todas as personagens sao geradas na MESMA pose e MESMO canvas, para que o
# script de recorte do rig seja identico para todas.
# ---------------------------------------------------------------------------
master_canvas:
  pose: a_pose
  facing: front
  # fracao da altura do canvas ocupada pela personagem
  subject_height_ratio: 0.85
  # margem inferior (pes) em fracao da altura — ancora do pivot
  floor_margin_ratio: 0.05
  background: transparent

# ---------------------------------------------------------------------------
# PROPORCOES CHIBI — alvo estilistico, verificavel visualmente
# ---------------------------------------------------------------------------
proportions:
  head_to_body_ratio: null   # [TEST REQUIRED] ex: 1:2.5, 1:3
  notes: >
    Definir apos ver os primeiros candidatos. A proporcao precisa sobreviver
    a reducao para 64px — cabeca grande demais vira mancha, pequena demais
    perde legibilidade.


# ===========================================================================
# STYLE SPECIFICATION v0
# ===========================================================================
#
# Descreve o EIXO ESTILO: como uma personagem e desenhada em versao chibi.
# NAO descreve identidade (cabelo, olhos, roupa, acessorios de uma personagem
# especifica) — isso vive em characters/<id>/. Ver docs/style-vs-identity.md.
#
# ESTADO: esqueleto. TODOS os campos observacionais estao null porque
# styles/chibi/references/ esta VAZIO. Preencher exige as imagens de
# referencia: inventar proporcao ou shading sem evidencia visual seria criar
# conteudo artistico, o que o agente nao pode fazer (AGENTS.md secao 2).
#
# Ao preencher: usar apenas o que for OBSERVAVEL. Quando a imagem nao permitir
# medir, registrar intervalo aproximado ou manter null com [TEST REQUIRED].
# Nao procurar uma "proporcao matematica universal" sem evidencia.

style:
  id: chibi_v0
  status: experimental
  source: user_reference_set
  spec_version: 0
  references_present: false     # vira true quando references/ tiver imagens

  # --- A. PROPORCAO ------------------------------------------------------
  # Registrar intervalo (ex: "1:2.5 a 1:3") quando um valor unico nao for
  # defensavel a partir das imagens.
  proportions:
    head_to_body_ratio: null      # [TEST REQUIRED]
    head_scale: null              # [TEST REQUIRED] tamanho relativo da cabeca
    head_width_relative: null     # [TEST REQUIRED] largura relativa
    torso_length: null            # [TEST REQUIRED]
    arm_length_relative: null     # [TEST REQUIRED]
    leg_length_relative: null     # [TEST REQUIRED]
    limb_scale: null              # [TEST REQUIRED]
    hand_scale: null              # [TEST REQUIRED]
    foot_scale: null              # [TEST REQUIRED]

  # --- B. ROSTO ----------------------------------------------------------
  face:
    eye_scale: null               # [TEST REQUIRED]
    eye_shape: null               # [TEST REQUIRED] formato geral
    nose_complexity: null         # [TEST REQUIRED] ex: ausente/ponto/tracco
    mouth_complexity: null        # [TEST REQUIRED]
    face_size_relative: null      # [TEST REQUIRED]
    facial_simplification: null   # [TEST REQUIRED] low/medium/high

  # --- C. CABELO ---------------------------------------------------------
  # Regra: cabelo pode ser simplificado, mas elementos que DEFINEM a
  # personagem devem sobreviver.
  hair:
    simplification: null          # [TEST REQUIRED]
    visual_thickness: null        # [TEST REQUIRED]
    main_strand_count: null       # [TEST REQUIRED] mechas principais
    silhouette_preservation: null # [TEST REQUIRED]
    identity_preservation: high   # REGRA, nao observacao

  # --- D. ROUPA ----------------------------------------------------------
  # Criterio dos mais importantes. Microdetalhe pode cair; o que identifica
  # a personagem, nao. Simplificada != reinterpretada.
  clothing:
    simplification: medium        # REGRA (ponto de partida) — revisar com refs
    identity_preservation: high   # REGRA
    detail_density: null          # [TEST REQUIRED]
    must_preserve:                # REGRA — o que nunca pode ser perdido
      - main_colors
      - silhouette
      - main_garments
      - characteristic_elements
      - important_patterns
      - identifying_visual_accessories
    may_simplify:
      - micro_detail
      - small_texture
      - secondary_ornament_density

  # --- 4. ACESSORIOS -----------------------------------------------------
  accessories:
    core_identity_preservation: very_high        # REGRA
    secondary_detail_simplification: allowed     # REGRA
    # Categorias que TIPICAMENTE sao core. A classificacao real e por
    # personagem e depende da arte-fonte — nao presumir.
    core_categories_examples:
      - weapon
      - hat
      - horns
      - ribbons
      - ornaments
      - flowers
      - jewelry
      - emblems

  # --- 5. SILHUETA -------------------------------------------------------
  # Deve continuar reconhecivel em tamanho pequeno. Uma personagem nao pode
  # depender de detalhe minusculo para ser identificada.
  silhouette:
    readability: high             # REGRA
    readable_at_px: null          # [TEST REQUIRED] validar em 64/96/128
    key_elements:                 # o que carrega a silhueta
      - hair
      - hat
      - horns
      - cape
      - sleeves
      - weapons
      - external_elements

  # --- 6. SHADING / RENDERING --------------------------------------------
  # Avaliacao qualitativa. Nao escolher numeros arbitrarios ainda.
  rendering:
    lineart: null                 # [TEST REQUIRED]
    shading: null                 # [TEST REQUIRED]
    shading_softness: null        # [TEST REQUIRED]
    highlights: null              # [TEST REQUIRED]
    contrast: null                # [TEST REQUIRED]
    render_level: null            # [TEST REQUIRED]

  # --- 7. GAME CHARACTER vs GENERIC CHIBI --------------------------------
  # O alvo NAO e "qualquer personagem anime chibi", e "personagem que parece
  # pertencer ao mesmo jogo". Eixos em que a consistencia e verificada.
  game_consistency:
    checked_axes:
      - proportions
      - render
      - eyes
      - lineart
      - shading
      - detail_density
      - accessory_treatment
    status: null                  # [TEST REQUIRED]

  # --- REFERENCIAS -------------------------------------------------------
  # Preencher com os arquivos de styles/chibi/references/.
  # NAO incluir arte das nossas personagens aqui (ver styles/chibi/README.md).
  references:
    chibi: []                     # exemplos do RESULTADO desejado
    splash: []                    # arte original / par splash -> chibi
