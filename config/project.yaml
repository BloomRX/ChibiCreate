# ChibiCreate — configuração canônica do projeto
# Todos os números aqui são CONFIGURÁVEIS e provisórios.
# Nada aqui é verdade absoluta até o MVP produzir dados. Ver docs/pipeline.md §Resolução.

schema_version: 1

project:
  name: ChibiCreate
  engine: godot
  engine_version_target: "4.x"   # [TEST REQUIRED] confirmar versão exata do projeto Godot

# ---------------------------------------------------------------------------
# RESOLUÇÃO
# Valores iniciais. O MVP deve gerar a comparação 64/96/128 px antes de congelar.
# ---------------------------------------------------------------------------
resolution:
  master:
    width: 1024            # alternativa validada: 1536
    height: 1024
    canvas: square         # canvas fixo => script de rig igual p/ todas as personagens
  animation_working:
    height: 512            # ponto de partida; altura do personagem no frame de trabalho
  gameplay_output:
    # Altura de exibição do sprite em tela. AINDA NÃO DECIDIDO.
    display_height: null   # [TEST REQUIRED] depende da resolução alvo do jogo
    # Fator inteiro de supersampling: renderiza a display_height * factor e
    # faz UM downscale final. Fator inteiro evita shimmer.
    integer_factor: 2
  legibility_test:
    # O MVP deve emitir o mesmo sprite nestes tamanhos para avaliação humana.
    sizes: [64, 96, 128]

# ---------------------------------------------------------------------------
# ANIMAÇÃO
# Contagens de frame são ALVO do MVP, não regra de produção.
# ---------------------------------------------------------------------------
animation:
  defaults:
    idle:
      frames: 4
      fps: 7               # faixa inicial sugerida 6-8
      loop: true
    walk:
      frames: 6
      fps: 10              # faixa inicial sugerida ~10
      loop: true
  downscale_filter: lanczos
  single_downscale: true   # proibido encadear downscales

# ---------------------------------------------------------------------------
# EXPORT / SPRITESHEET
# ---------------------------------------------------------------------------
export:
  spritesheet:
    padding: 2
    power_of_two: true
    layout: grid
  pivot:
    mode: feet_center      # alternativas: center, custom
  naming:
    frame: "{character}_{anim}_{index:02d}.png"
    sheet: "{character}_{anim}_sheet.png"
  godot:
    import_filter: nearest
    generate_mipmaps: false
    spriteframes_resource: "SpriteFrames.tres"

# ---------------------------------------------------------------------------
# RIG — decomposição padrão. Personagens podem sobrescrever em character.yaml.
# ---------------------------------------------------------------------------
rig:
  default_parts:
    - hair_back
    - torso
    - leg_left
    - leg_right
    - arm_left
    - arm_right
    - head
    - hair_front
    - weapon
    - accessory
  # Ordem acima = ordem de desenho (trás para frente).
  optional_parts:
    - weapon
    - accessory
  allow_character_overrides: true

# ---------------------------------------------------------------------------
# ESTILO — arquitetura preparada para LoRA, mas DESLIGADA no MVP.
# ---------------------------------------------------------------------------
style:
  active: chibi
  model: null              # resolvido via config/models.lock.yaml
  lora:
    enabled: false         # §16: NÃO treinar Style LoRA no MVP
    name: null
    weight: 0.8

# ---------------------------------------------------------------------------
# REFERÊNCIAS DE IDENTIDADE
# O número de refs é variável (1..3). Não assumir sempre 3.
# ---------------------------------------------------------------------------
identity:
  max_reference_images: 3
  reference_roles:
    - full_body
    - face
    - weapon
    - hair
    - outfit
  required_roles:
    - full_body

# ---------------------------------------------------------------------------
# EXECUÇÃO
# ---------------------------------------------------------------------------
runtime:
  default_environment: local
  work_dir: work
  candidates_default: 8
