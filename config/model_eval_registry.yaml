# Registry central da matriz de avaliacao de modelos (FASE 3B).
#
# ESTE ARQUIVO E A UNICA FONTE DA VERDADE dos dois notebooks:
#   notebooks/model_eval_model_only.ipynb    (Original -> Modelo)
#   notebooks/model_eval_flux_refiner.ipynb  (FLUX run_003 -> Modelo)
#
# Regra: nenhum condicional de modelo espalhado pelos notebooks. Se algo
# muda entre modelos, muda AQUI.
#
# AVISO SOBRE HASHES: sha256 de pesos so e preenchido depois de baixar e
# conferir de fato. Onde nao houve download, o campo fica `null` com
# `hash_verified: false`. Nao inventamos hash.
#
# AVISO SOBRE TAMANHOS: `download_gb` e `vram_gb` marcados
# `estimated: true` vem de documentacao/model card, NAO de medicao nossa.
# O preflight compara contra eles, mas eles nao sao medida do agente.

schema_version: 1

# Prompt comum a toda a matriz. Override por modelo em `prompt_override`.
base_prompt: >-
  Preserve the exact same character identity, face, hair, eyes, horns, body
  proportions, color palette, and overall chibi style from the input image.
  Preserve the original character design shown in the reference images,
  especially the clothing, cape, golden ornaments, accessories, and their
  shapes and placement. Do not redesign, replace, modernize, sexualize,
  simplify away, or invent clothing elements. Redraw the character as a clean
  polished game/gacha chibi character while keeping the original outfit design
  recognizable and faithful to the references. Only make changes necessary to
  adapt the original design naturally to the chibi proportions. Full body,
  front-facing, clean silhouette, consistent lineart, polished game art, soft
  shading, highly readable at small size. The output should look like the same
  original character converted into chibi form, not a new character inspired
  by the original.

# Sem negative prompt automatico, por instrucao. Um modelo so ganha negative
# se a documentacao dele exigir, e ai fica registrado como override.
base_negative_prompt: ""

character: waifu_001

# Eixos de avaliacao. OVERALL nao existe aqui de proposito: nao ha formula.
evaluation_axes: [STYLE, IDENTITY, DESIGN_PRESERVATION]
primary_axis: DESIGN_PRESERVATION

# Itens que a analise visual deve cobrir explicitamente.
inspection_checklist:
  - roupa
  - capa
  - ornamentos
  - acessorios
  - chifres
  - cabelo
  - rosto
  - silhueta
  - proporcoes_chibi
  - preservacao_de_cores
  - detalhes_inventados_ou_removidos

models:

  # ------------------------------------------------------------------
  longcat_image_edit:
    label: "LongCat-Image-Edit"
    repo: meituan-longcat/LongCat-Image-Edit
    revision: null                 # nao fixada: nao baixamos para conferir
    revision_verified: false
    params: "6B (transformer) + Qwen2.5-VL-7B como text encoder"
    pipeline_type: instruction_edit_single_image
    input_mode: image_plus_instruction

    # CAPACIDADE REAL, nao desejada. O card oficial documenta UMA imagem de
    # entrada. Multi-image foi declarado "prioridade da proxima versao" pelos
    # autores, ou seja: nao existe hoje.
    references_supported: 0
    reference_limitation: >-
      Aceita apenas UMA imagem. Nao ha slot para referencias de design
      adicionais. No Notebook 2 a imagem editada e a saida do FLUX e
      full_body/outfit NAO entram — a limitacao e registrada no recipe, nunca
      contornada em silencio.

    parameters:
      steps: 50
      cfg: 4.5
      sampler: default_pipeline
      scheduler: default_pipeline
      denoise: null                # editor por instrucao: nao expoe denoise
      resolution: [1024, 1024]
      batch: 1
      resolution_note: "O codigo oficial suporta ~1MP."

    download_gb: 24.0
    download_estimated: true
    vram_gb: 18.0
    vram_estimated: true
    vram_note: >-
      ~18 GB exigem enable_model_cpu_offload() conforme o card oficial. Sem
      offload o requisito e maior. Nao medimos.
    disk_gb: 30.0
    ram_gb: 16.0

    license: apache-2.0
    license_source: "model card oficial HF (meituan-longcat/LongCat-Image-Edit)"
    license_verified: true
    commercial_status: verified
    third_party_quantization: false

    status: CANDIDATE
    notes: >-
      Nao assumir que e leve por ser 6B: o text encoder Qwen2.5-VL-7B entra
      por cima. Preflight real obrigatorio.

  # ------------------------------------------------------------------
  z_image_turbo:
    label: "Z-Image Turbo"
    repo: Tongyi-MAI/Z-Image-Turbo
    revision: null
    revision_verified: false
    params: "6B S3-DiT"

    # PONTO CRITICO DE HONESTIDADE: Z-Image Turbo e TEXT-TO-IMAGE. Nao e
    # editor por instrucao e nao tem slot de referencia. Z-Image-Edit foi
    # anunciado mas nao lancado. Usar via img2img latente (VAEEncode +
    # denoise < 1.0) e legitimo e foi autorizado explicitamente pelo
    # usuario, mas NAO e edicao por instrucao e nao preserva design da
    # mesma forma. Nao vamos fingir o contrario.
    pipeline_type: text_to_image_with_img2img_latent
    input_mode: img2img_latent
    references_supported: 0
    reference_limitation: >-
      NAO e um editor multi-reference. E um gerador text-to-image usado em
      modo img2img (VAEEncode + denoise). Nao existe slot para full_body nem
      outfit: o unico condicionamento visual e a propria imagem de entrada,
      via latente. A fidelidade ao design depende inteiramente do denoise.
    capability_warning: >-
      Z-Image-Edit foi anunciado pela Tongyi-MAI mas nao lancado ate a data
      deste registry. Qualquer resultado aqui mede img2img, nao edicao.

    parameters:
      steps: 8
      cfg: 1.0
      sampler: euler
      scheduler: simple
      denoise: 0.5
      denoise_status: BASELINE_HYPOTHESIS
      resolution: [1024, 1024]
      batch: 1
      cfg_note: >-
        Turbo e destilado para poucos passos; o card usa guidance baixo.
        cfg 4.5 e 50 steps sao do Z-Image BASE, nao do Turbo.

    download_gb: 14.0
    download_estimated: true
    vram_gb: 16.0
    vram_estimated: true
    disk_gb: 20.0
    ram_gb: 12.0

    license: apache-2.0
    license_source: "model card oficial HF (Tongyi-MAI) + repo GitHub"
    license_verified: true
    commercial_status: verified
    third_party_quantization: false

    status: CANDIDATE
    notes: >-
      No Notebook 2 so faz sentido como img2img da saida do FLUX. Registrar
