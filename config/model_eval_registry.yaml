      cfg: 2.5
      sampler: euler
      scheduler: simple
      denoise: 0.5
      denoise_status: BASELINE_HYPOTHESIS
      resolution: [1024, 1024]
      batch: 1

    # ~9.8 GB de pesos + text encoder ~8 GB + VAE ~0.25 GB.
    download_gb: 19.6
    download_estimated: false
    download_note: >-
      9.92 (GGUF) + 9.38 (text encoder) + 0.25 (VAE). Tamanhos lidos da
      arvore de arquivos dos repos.
    vram_gb: 10.0
    ram_estimated: true
    ram_note: >-
      NAO medido por nos. Num GGUF o text encoder (9.38 GB) e o VAE ficam na
      RAM do sistema: e dai que vem a economia de VRAM. 16 GB e o valor
      conservador para caber encoder + processo do ComfyUI + kernel.
      IMPORTANTE: o Colab T4 tem ~12.7 GB de RAM, abaixo disso. RAM
      insuficiente com GGUF nao levanta erro — o processo entra em swap e a
      sessao TRAVA em silencio, que foi o sintoma observado na celula 9.
      [TEST REQUIRED] confirmar o consumo real de RAM antes de baixar o
