  qwen_edit_2511_q4_0:
    label: "Qwen-Image-Edit-2511 Q4_0"
    repo: unsloth/Qwen-Image-Edit-2511-GGUF
    # NOME EXATO conferido na arvore de arquivos do repo (ver Q3_K_M).
    file: qwen-image-edit-2511-Q4_0.gguf
