      RAM do sistema: e dai que vem a economia de VRAM. 16 GB e o valor
      conservador para caber encoder + processo do ComfyUI + kernel.
      IMPORTANTE: o Colab T4 tem ~12.7 GB de RAM, abaixo disso. RAM
      insuficiente com GGUF nao levanta erro — o processo entra em swap e a
      sessao TRAVA em silencio, que foi o sintoma observado na celula 9.
      [TEST REQUIRED] confirmar o consumo real de RAM antes de baixar o
      valor exigido.
    vram_estimated: true
    vram_note: "Assume text encoder e VAE em RAM do sistema."
    disk_gb: 28.0
    ram_gb: 16.0

    license: apache-2.0
    license_source: "Qwen/Qwen-Image-Edit-2511 (modelo-base), Apache 2.0"
    license_verified: true
    quantization_license: apache-2.0
    quantization_license_source: >-
      Card do unsloth/Qwen-Image-Edit-2511-GGUF declara Apache 2.0, herdada
      do modelo-base. Nao confirmamos revision nem hash dos arquivos.
    quantization_license_verified: false
    quantization_author: unsloth
    third_party_quantization: true
    commercial_status: pending_human_review
    commercial_status_reason: >-
      Igual ao Q3_K_M: base Apache 2.0, variante quantizada de terceiro sem
      hash conferido.

    status: CANDIDATE
    try_first: false
    notes: "Rodar apenas depois do Q3_K_M, em sessao separada."

  # ------------------------------------------------------------------
  wai_illustrious_sdxl_v170:
    label: WAI-illustrious-SDXL (benchmark comparativo)
    matrix_candidate: false
    matrix_exclusion_reason: >
      Nao entra na matriz de avaliacao de modelos de EDICAO
      (notebooks/model_eval_*.ipynb). Aquela matriz compara modelos que
      recebem imagem como referencia; este e um checkpoint SDXL de
      geracao com img2img, avaliado no seu proprio benchmark
      comparativo (notebooks/wai_illustrious_sdxl_eval.ipynb).
      Misturar os dois faria a matriz comparar coisas diferentes.
    repo: null
    source: civitai
    source_url: https://civitai.red/models/827184/wai-illustrious-sdxl
    civitai_model_id: 827184
    civitai_model_version_id: null
    civitai_version_id_verified: false
    revision: null
    revision_verified: false
    version_note: >
      [BLOQUEIO REAL] O usuario pediu para identificar a versao NO CIVITAI e
      registrar model_id, modelVersionId, arquivo e SHA256. civitai.red e
      civitai.com estao FORA da allowlist de egress desta sandbox (handshake
      TLS morre). Portanto modelVersionId, nome exato do arquivo e SHA256
      NAO foram verificados e ficam null. Nao inventamos esses valores e nao
      trocamos por outra versao do WAI por conta propria.
      O `models.lock.yaml` ja continha uma entrada anterior apontando v17.0,
      tambem nao verificada. A versao efetiva DEVE ser fixada por um humano
      no Colab (que enxerga o Civitai) antes da primeira execucao.
    base_model: Illustrious-XL (SDXL)
    params: "~2.6B (UNet SDXL finetune)"
    pipeline_type: sdxl_checkpoint_ipadapter
    input_mode: ipadapter_embeds
    references_supported: 3
    reference_mechanism: ipadapter_encode_combine
    reference_mechanism_note: >
      CORRECAO (diretiva do usuario): "SDXL nao tem multi-referencia nativa"
      NAO significa "SDXL nao consegue usar multiplas referencias". O
      checkpoint nao tem mecanismo proprio como o ReferenceLatent do FLUX,
      mas o IP-Adapter fornece multi-referencia real via CLIP-Vision:
        full_body -> IPAdapterEncoder --+
        face      -> IPAdapterEncoder --+-> IPAdapterCombineEmbeds
        outfit    -> IPAdapterEncoder --+           |
                                          IPAdapterEmbeds -> KSampler
      Escolhemos Encoder+Combine em vez de empilhar IPAdapterAdvanced em
      serie porque so essa rota permite declarar e auditar o peso de CADA
      referencia separadamente.
    reference_equivalence_note: >
      [NAO AFIRMAR EQUIVALENCIA] FLUX faz multi-referencia pelo mecanismo
      proprio (ReferenceLatent, no espaco latente); WAI faz por IP-Adapter
      (embeddings CLIP-Vision injetados por cross-attention paralela). Sao
      implementacoes DIFERENTES. A comparacao do benchmark e sobre o
      RESULTADO VISUAL com as MESMAS referencias de entrada, nunca sobre
      equivalencia de arquitetura.

    # BLOQUEIO DECLARADO: multi-referencia exige custom node de terceiro.
    requires_custom_node: ComfyUI_IPAdapter_plus
    custom_node_repo: https://github.com/cubiq/ComfyUI_IPAdapter_plus
    custom_node_ack_required: true
    custom_node_note: >
      A regra do projeto proibe instalar custom node arbitrariamente. Este
      nao e arbitrario: e a implementacao de referencia do IP-Adapter em
      ComfyUI (autor cubiq), exigida explicitamente pela diretiva. O
      notebook pede aceite EXPLICITO antes de instalar e registra o commit
      efetivamente usado. Se a instalacao falhar ou os nodes nao aparecerem
      no /object_info, o benchmark PARA — a Run 003 nunca cai para uma
      referencia em silencio.
    custom_node_nodes:
      - IPAdapterModelLoader
      - IPAdapterEncoder
      - IPAdapterCombineEmbeds
      - IPAdapterEmbeds

    # Pesos auxiliares do IP-Adapter (nao sao o checkpoint).
    ipadapter_models:
      adapter:
        file: ip-adapter-plus_sdxl_vit-h.safetensors
        repo: h94/IP-Adapter
        repo_path: sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors
        target_dir: models/ipadapter
        license: apache-2.0
        license_verified: true
        license_source: https://huggingface.co/h94/IP-Adapter
        sha256: null
        sha256_note: >
          Preenchido na execucao, a partir do arquivo realmente baixado.
          Nao inventamos hash aqui.
        choice_note: >
          Variante "plus" usa patch embeddings e fica MAIS proxima da imagem
          de referencia que a base — que e exatamente o eixo medido
          (DESIGN_PRESERVATION). Pareado com encoder ViT-H conforme a tabela
          oficial do cubiq; trocar o encoder por bigG aqui daria erro de
          dimensao de tensor.
      clip_vision:
        file: CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors
        repo: h94/IP-Adapter
        repo_path: models/image_encoder/model.safetensors
        target_dir: models/clip_vision
        rename_required: true
        rename_note: >
          O arquivo chama-se model.safetensors no repo; o IP-Adapter exige o
          nome canonico acima. Renomear faz parte da instalacao.
        license: apache-2.0
        license_verified: true
        sha256: null

    reference_roles:
      full_body:
        weight: 1.0
        role: composicao, silhueta e proporcao gerais
      face:
        weight: 0.6
        role: identidade facial
      outfit:
        weight: 0.8
        role: roupa, capa e ornamentos dourados
    reference_weights_status: BASELINE_EXPERIMENTAL
    reference_weights_note: >
      Valores iniciais dados pela diretiva (full_body 1.0 / face 0.6 /
      outfit 0.8). NAO sao valores validados nem otimizados: sao hipotese
      inicial. Sem sweep nesta rodada — uma unica configuracao baseline,
      com os tres pesos registrados individualmente no recipe. A calibracao
      fica para uma rodada especifica.
    combine_method: concat
    combine_method_status: BASELINE_EXPERIMENTAL
    combine_method_note: >
      "concat" preserva os tokens de cada referencia em vez de media-los,
      entao roupa e rosto nao se dissolvem um no outro. Alternativas do node
      (add, subtract, average, norm average, max, min) nao foram testadas
      nesta rodada.

    parameters:
      steps: 20
      cfg: 6.0
      sampler: euler_ancestral
      sampler_note: >
        "Euler a" na nomenclatura do A1111 = `euler_ancestral` no ComfyUI.
        Mesmo sampler, nomes diferentes.
      scheduler: normal
      scheduler_note: >
        O autor nao declara scheduler. "normal" e o padrao do ComfyUI para
        SDXL e o que corresponde ao comportamento do A1111 com Euler a.
        Registrado explicitamente por ser escolha nossa, nao do autor.
      denoise: 1.0
      denoise_status: DERIVED_FROM_PIPELINE
      denoise_note: >
        1.0 porque a geracao e txt2img a partir de EmptyLatentImage. Vale
        para o baseline (v0) e para a rota IP-Adapter (v2), onde a
        referencia entra por embedding, nao pelo latente inicial.
      resolution: [1024, 1344]
      resolution_note: >
        MUDANCA nesta rodada: era 1024x1024. O autor do v17.0 declara
        resolucao nativa maior que 1024x1024 e da 1024x1344 como exemplo.
        Gerar abaixo do nativo e causa conhecida de artefato e deformacao em
        SDXL, entao 1024x1024 era candidato real a explicar o resultado
        ruim. A saida deixa de ter o mesmo formato do FLUX (1024x1024):
        LIMITACAO REGISTRADA da comparacao, nao ajuste silencioso. As
        imagens de referencia NAO foram alteradas.
      batch: 1
      seed: 42
      hires_fix: false
      hires_note: >
        O autor recomenda Hires fix 1.5x / 20 steps / R-ESRGAN 4x+ Anime6B /
        denoise 0.35-0.5. NAO usado nesta rodada por instrucao explicita:
        primeiro um baseline limpo. Fica para experimento separado.
      parameters_source: >
        Faixas declaradas pelo autor do v17.0 (steps 15-30, CFG 5-7,
        Euler a). Escolhemos o meio: 20 steps, CFG 6.0. Antes usavamos
        30 steps / CFG 7.0, o topo da faixa. Nao e sweep: uma configuracao
        so, dentro do recomendado.

    workflows:
      run_001: experimental/wai_illustrious_ipadapter@v0
      run_002: experimental/wai_illustrious_ipadapter@v0
      run_003: experimental/wai_illustrious_ipadapter@v2
    workflows_note: >
      MUDANCA nesta rodada. Runs 001/002 passam ao BASELINE v0: txt2img
      puro, so nodes Core, sem IP-Adapter. Objetivo diagnostico — saber se
      o checkpoint funciona antes de julgar o IP-Adapter. A Run 003 segue
      no v2 (3 referencias), inalterada. O v1 (1 referencia via IP-Adapter)
      fica preservado, sem uso nesta rodada.
      CONSEQUENCIA: as Runs 001/002 NAO consomem full_body. Sem IP-Adapter
      o SDXL nao recebe imagem de referencia, e com denoise 1.0 um img2img
      descartaria o latente. A referencia fica registrada como
      declarada-mas-nao-consumida, nunca omitida em silencio.

    prompt_mode: short_author_recommended
    prompt_override: >-
      masterpiece, best quality, amazing quality, clean polished stylized
      chibi full-body character, preserve the same character identity, black
      hair, red eyes, horns, black outfit, long black cape and golden
      ornaments, cute game/gacha chibi character, full body, centered
      composition
    prompt_override_reason: >
      MUDANCA nesta rodada: antes usavamos o `base_prompt` compartilhado com
      o FLUX (906 caracteres). O autor do WAI alerta que excesso de quality
      tags e prompts longos REDUZEM a qualidade em modelos Illustrious. Um
      prompt longo era candidato real a explicar o resultado ruim: nao da
      para diagnosticar o checkpoint com um prompt que a documentacao dele
      desaconselha. CONSEQUENCIA REGISTRADA: WAI e FLUX deixam de usar
      prompt identico, o que enfraquece a comparacao direta de prompt — mas
      e necessario para responder primeiro "o checkpoint funciona?". Nao e
      prompt inventado para embelezar o WAI: e o formato recomendado pelo
      autor, com os mesmos elementos de design do benchmark (cabelo preto,
      olhos vermelhos, chifres, capa longa, ornamentos dourados).
    negative_prompt_override: "bad quality, worst quality, worst detail, sketch, censor"
    negative_prompt_reason: >
      Negativo curto declarado pelo autor. Nada acrescentado nesta rodada:
      o proprio autor avisa que negativos longos pioram o resultado.

    download_gb: 10.5
    download_estimated: true
    vram_gb: 12.0
    vram_estimated: true
    vram_note: >
      SDXL fp16 ~8-10 GB, mais IP-Adapter (~1 GB) e CLIP-Vision ViT-H
      (~2.5 GB, roda no encode). Estimativa ~12 GB, ainda dentro da T4 de
      15 GB, mas com folga menor que a rota img2img. Nao medido por nos: o
      preflight do notebook mede de verdade e emite BLOCKED se nao couber.
    disk_gb: 12.0
    ram_gb: 12.0
    license: faipl-1.0-sd
    license_name: Fair AI Public License 1.0-SD
    license_link: https://freedevproject.org/faipl-1.0-sd/
    license_source: >
      Herdada do Illustrious-XL. NAO lida em fonte primaria: o Civitai esta
      bloqueado nesta sandbox. Corroborada por model cards espelho no
      HuggingFace (John6666/wai-nsfw-illustrious-*) que declaram
      license_name: faipl-1.0-sd.
    license_verified: false
    license_conflict_note: >
      O usuario observou "Commercial use allowed" na interface do Civitai.
      Isso e registrado como evidencia, mas NAO substitui o texto da licenca:
      os botoes do Civitai sao metadados preenchidos pelo autor e ja
      divergiram do LICENSE em outros modelos. A FAIPL diz que o output nao e
      coberto, mas tambem fala em proibir monetizacao proprietaria
      closed-source; a OnomaAI reconheceu a ambiguidade publicamente.
      Registrar os dois lados sem reinterpretar.
    commercial_status: pending_human_review
    commercial_banner: "Benchmark comparativo — licenca pendente de revisao humana"
    excluded_from_commercial_ranking: false
    status: MODEL_MISSING
    notes: >
      [HUMAN REVIEW REQUIRED] Nome original do projeto e
      "WAI-NSFW-illustrious-SDXL", com foco declarado em conteudo adulto. Nao
      adicionamos nenhuma tag NSFW aos prompts; registramos porque afeta o
      comportamento do modelo. Benchmark comparativo apenas: NAO e pipeline
      oficial e NAO substitui o baseline FLUX.

  pony_diffusion_v6_xl:
    label: "Pony Diffusion V6 XL (research only)"
    repo: LyliaEngine/Pony_Diffusion_V6_XL
    revision: null
    revision_verified: false
    base_model: stabilityai/stable-diffusion-xl-base-1.0
    params: "~2.6B (UNet SDXL finetune)"

    # SDXL nao e editor por instrucao. Sem ControlNet/IP-Adapter (ambos fora
    # de escopo por instrucao), o unico modo com imagem e img2img latente.
    pipeline_type: sdxl_checkpoint_img2img
    input_mode: img2img_latent
    references_supported: 0
    reference_limitation: >-
      Checkpoint SDXL: nao aceita referencia de imagem sem IP-Adapter ou
      ControlNet, ambos fora de escopo por instrucao. Unico modo disponivel e
      img2img latente. Nao preserva design por referencia.

    parameters:
      steps: 25
      cfg: 7.0
      sampler: euler_ancestral
      scheduler: normal
      denoise: 0.5
      denoise_status: BASELINE_HYPOTHESIS
      resolution: [1024, 1024]
      batch: 1

    # Pony exige as score tags; sem elas a saida degrada. Isso e exigencia
    # documentada do proprio modelo, entao entra como override registrado.
    prompt_override_prefix: "score_9, score_8_up, score_7_up, score_6_up, "
    prompt_override_reason: >-
      As score tags sao exigencia documentada do Pony V6; sem elas a saida
      degrada. Override registrado, nao invencao artistica.

    download_gb: 7.0
    download_estimated: true
    vram_gb: 10.0
    vram_estimated: true
    disk_gb: 12.0
    ram_gb: 12.0

    license: faipl-1.0-sd-modified
    license_name: "Fair AI Public License 1.0-SD (modificada)"
    license_link: https://freedevproject.org/faipl-1.0-sd/
    license_source: >-
      Card do modelo e pagina do autor: "You are not permitted to run
      inference of this model on websites or applications allowing any form
      of monetization (paid inference, faster tiers, etc.). This applies to
      any derivative models or model merges." Permissao comercial explicita
      concedida apenas a CivitAI e Hugging Face; demais casos exigem contato
      com contact@purplesmart.ai.
    license_verified: true
    license_conflict_note: >-
      Ha fontes de terceiros afirmando "CreativeML OpenRAIL-M" e
