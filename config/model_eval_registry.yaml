    status: CANDIDATE
    try_first: false
    notes: "Rodar apenas depois do Q3_K_M, em sessao separada."

  # ------------------------------------------------------------------
  wai_illustrious_sdxl_v170:
    label: WAI-illustrious-SDXL (benchmark comparativo)
    matrix_candidate: false
    matrix_exclusion_reason: >
      Nao entra na matriz de avaliacao de modelos de EDICAO
      (notebooks/model_eval_*.ipynb). Aquela matriz compara modelos que
      recebem imagem como referencia; este e um checkpoint SDXL de
      geracao com img2img, avaliado no seu proprio benchmark
      comparativo (notebooks/wai_illustrious_sdxl_eval.ipynb).
      Misturar os dois faria a matriz comparar coisas diferentes.
    repo: null
    source: civitai
    source_url: https://civitai.red/models/827184/wai-illustrious-sdxl
    civitai_model_id: 827184
    civitai_model_version_id: null
    civitai_version_id_verified: false
    revision: null
    revision_verified: false
    version_note: >
      [BLOQUEIO REAL] O usuario pediu para identificar a versao NO CIVITAI e
      registrar model_id, modelVersionId, arquivo e SHA256. civitai.red e
      civitai.com estao FORA da allowlist de egress desta sandbox (handshake
      TLS morre). Portanto modelVersionId, nome exato do arquivo e SHA256
      NAO foram verificados e ficam null. Nao inventamos esses valores e nao
      trocamos por outra versao do WAI por conta propria.
      O `models.lock.yaml` ja continha uma entrada anterior apontando v17.0,
      tambem nao verificada. A versao efetiva DEVE ser fixada por um humano
      no Colab (que enxerga o Civitai) antes da primeira execucao.
    base_model: Illustrious-XL (SDXL)
    params: "~2.6B (UNet SDXL finetune)"
    pipeline_type: sdxl_checkpoint_img2img_ipadapter
    input_mode: img2img_latent_plus_ipadapter_embeds
    references_supported: 3
    reference_mechanism: ipadapter_encode_combine
    reference_mechanism_note: >
      CORRECAO (diretiva do usuario): "SDXL nao tem multi-referencia nativa"
      NAO significa "SDXL nao consegue usar multiplas referencias". O
      checkpoint nao tem mecanismo proprio como o ReferenceLatent do FLUX,
      mas o IP-Adapter fornece multi-referencia real via CLIP-Vision:
        full_body -> IPAdapterEncoder --+
        face      -> IPAdapterEncoder --+-> IPAdapterCombineEmbeds
        outfit    -> IPAdapterEncoder --+           |
                                          IPAdapterEmbeds -> KSampler
      Escolhemos Encoder+Combine em vez de empilhar IPAdapterAdvanced em
      serie porque so essa rota permite declarar e auditar o peso de CADA
      referencia separadamente.
    reference_equivalence_note: >
      [NAO AFIRMAR EQUIVALENCIA] FLUX faz multi-referencia pelo mecanismo
      proprio (ReferenceLatent, no espaco latente); WAI faz por IP-Adapter
      (embeddings CLIP-Vision injetados por cross-attention paralela). Sao
      implementacoes DIFERENTES. A comparacao do benchmark e sobre o
      RESULTADO VISUAL com as MESMAS referencias de entrada, nunca sobre
      equivalencia de arquitetura.

    # BLOQUEIO DECLARADO: multi-referencia exige custom node de terceiro.
    requires_custom_node: ComfyUI_IPAdapter_plus
    custom_node_repo: https://github.com/cubiq/ComfyUI_IPAdapter_plus
    custom_node_ack_required: true
    custom_node_note: >
      A regra do projeto proibe instalar custom node arbitrariamente. Este
      nao e arbitrario: e a implementacao de referencia do IP-Adapter em
      ComfyUI (autor cubiq), exigida explicitamente pela diretiva. O
      notebook pede aceite EXPLICITO antes de instalar e registra o commit
      efetivamente usado. Se a instalacao falhar ou os nodes nao aparecerem
      no /object_info, o benchmark PARA — a Run 003 nunca cai para uma
      referencia em silencio.
    custom_node_nodes:
      - IPAdapterModelLoader
      - IPAdapterEncoder
      - IPAdapterCombineEmbeds
      - IPAdapterEmbeds

    # Pesos auxiliares do IP-Adapter (nao sao o checkpoint).
    ipadapter_models:
      adapter:
        file: ip-adapter-plus_sdxl_vit-h.safetensors
        repo: h94/IP-Adapter
        repo_path: sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors
        target_dir: models/ipadapter
        license: apache-2.0
        license_verified: true
        license_source: https://huggingface.co/h94/IP-Adapter
        sha256: null
        sha256_note: >
          Preenchido na execucao, a partir do arquivo realmente baixado.
          Nao inventamos hash aqui.
        choice_note: >
          Variante "plus" usa patch embeddings e fica MAIS proxima da imagem
          de referencia que a base — que e exatamente o eixo medido
          (DESIGN_PRESERVATION). Pareado com encoder ViT-H conforme a tabela
          oficial do cubiq; trocar o encoder por bigG aqui daria erro de
          dimensao de tensor.
      clip_vision:
        file: CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors
        repo: h94/IP-Adapter
        repo_path: models/image_encoder/model.safetensors
        target_dir: models/clip_vision
        rename_required: true
        rename_note: >
          O arquivo chama-se model.safetensors no repo; o IP-Adapter exige o
          nome canonico acima. Renomear faz parte da instalacao.
        license: apache-2.0
        license_verified: true
        sha256: null

    reference_roles:
      full_body:
        weight: 1.0
        role: composicao, silhueta e proporcao gerais
      face:
        weight: 0.6
        role: identidade facial
      outfit:
        weight: 0.8
        role: roupa, capa e ornamentos dourados
    reference_weights_status: BASELINE_EXPERIMENTAL
    reference_weights_note: >
      Valores iniciais dados pela diretiva (full_body 1.0 / face 0.6 /
      outfit 0.8). NAO sao valores validados nem otimizados: sao hipotese
      inicial. Sem sweep nesta rodada — uma unica configuracao baseline,
      com os tres pesos registrados individualmente no recipe. A calibracao
      fica para uma rodada especifica.
    combine_method: concat
    combine_method_status: BASELINE_EXPERIMENTAL
    combine_method_note: >
      "concat" preserva os tokens de cada referencia em vez de media-los,
      entao roupa e rosto nao se dissolvem um no outro. Alternativas do node
      (add, subtract, average, norm average, max, min) nao foram testadas
      nesta rodada.

    parameters:
      steps: 20
      cfg: 6.0
      sampler: euler_ancestral
      sampler_note: >
        "Euler a" do A1111 = `euler_ancestral` no ComfyUI.
      scheduler: normal
      scheduler_note: >
        O autor nao declara scheduler. "normal" e o padrao do ComfyUI para
        SDXL. Registrado por ser escolha nossa, nao do autor.
      denoise: 0.50
      denoise_status: BASELINE_EXPERIMENTAL
      denoise_note: >
        CORRECAO desta rodada: era 1.0. Com denoise 1.0 o latente inicial e
        destruido e o processo vira txt2img na pratica — a personagem
        original deixaria de guiar o resultado. O benchmark e
        PERSONAGEM -> WAI -> CHIBI, entao denoise TEM de ser < 1.0.
        0.50 e ponto de partida, NAO valor otimizado e NAO validado:
        mais baixo preserva a arte original mas resiste a virar chibi;
        mais alto vira chibi mas perde identidade. Sem sweep nesta rodada.
        Configuravel no notebook.
      resolution: from_source_image
      resolution_note: >
        CORRECAO desta rodada: era 1024x1344 fixo. Em img2img a resolucao
        de saida e a da IMAGEM DE PARTIDA, nao um parametro livre.
        `full_body.png` e 1024x1024 (quadrado). Forcar 1024x1344 exigiria
        redimensionar a arte original de aspect 1.0 para 0.76, ou seja,
        DEFORMAR a personagem — proibido por instrucao. Por isso o grafo
        NAO tem node de resize e a saida herda 1024x1024.
        Efeito colateral positivo: volta a bater com o formato do FLUX
        (1024x1024), o que fortalece a comparacao.
        1024x1024 e resolucao nativa valida de SDXL. O autor cita 1024x1344
        como exemplo para txt2img, onde a proporcao e escolha livre.
      batch: 1
      seed: 42
      hires_fix: false
      hires_note: >
        Recomendado pelo autor (1.5x / 20 steps / R-ESRGAN 4x+ Anime6B /
        denoise 0.35-0.5), mas NAO usado nesta rodada por instrucao.
      parameters_source: >
        steps 20 e CFG 6.0 sao o meio das faixas do autor do v17.0
        (15-30 e 5-7), com Euler a. denoise e resolucao NAO vem do autor:
        decorrem do pipeline img2img deste benchmark.

    workflows:
      run_001: experimental/wai_illustrious_ipadapter@v0
      run_002: experimental/wai_illustrious_ipadapter@v0
      run_003: experimental/wai_illustrious_ipadapter@v2
    workflows_note: >
      CORRECAO desta rodada: as tres runs sao IMG2IMG REAL. O latente
      inicial vem de full_body.png (LoadImage -> VAEEncode -> KSampler) em
      TODAS elas. A referencia nunca e descartada: ela e a imagem de
      partida (primary_image_role: source_image).
      v0 = Runs 001/002: img2img puro, sem IP-Adapter. So a imagem original
      guia o resultado.
      v2 = Run 003: o mesmo img2img MAIS multi-referencia via IP-Adapter.
      Nele full_body.png tem DOIS papeis (latente inicial e referencia do
      IP-Adapter), registrado como dual_role no recipe.
      A comparacao 001 x 003 isola exatamente o efeito do IP-Adapter:
      tudo o mais e identico.
      O v1 (1 referencia via IP-Adapter, sem img2img) fica preservado no
      repositorio, sem uso nesta rodada.

    prompt_mode: generic_chibi_base
    prompt_type: generic_chibi_base
    character_specific_prompt: false
    prompt_override: >-
      1girl, solo, full body, chibi, super deformed, large head, small body,
      short limbs, cute stylized anime character, clean lineart, simple cel
      shading, anime coloring, standing, simple background, masterpiece,
      best quality, amazing quality
    prompt_override_reason: >
      CORRECAO: o prompt anterior descrevia a waifu_001 em texto ("black
      hair, red eyes, horns, long black cape, golden ornaments"). Isso o
      tornava inutilizavel para qualquer outra personagem — cada waifu nova
      exigiria reescrever o prompt a mao, e o benchmark deixaria de produzir
      uma recipe reutilizavel.
      Separacao de responsabilidades da pipeline:
        imagem de entrada + referencias -> identidade e design especificos
        prompt                          -> transformacao estetica p/ chibi
        IP-Adapter                      -> reforco visual da identidade
        denoise                         -> quanto da estrutura pode mudar
      O prompt nao deve tentar reconstruir a personagem em texto: essa
      informacao ja esta no latente inicial (img2img) e nas referencias.
      Este prompt-base descreve APENAS o alvo estetico (proporcao chibi,
      lineart limpo, cel shading) e vale para waifu_001, waifu_002 e
      qualquer personagem futura, sem edicao manual.
      As quality tags do fim sao as declaradas pelo autor do checkpoint,
      nao embelezamento nosso.
    negative_prompt_override: >-
      bad quality, worst quality, worst detail, sketch, watermark,
      signature, logo, text, multiple views, realistic, photorealistic, 3d,
      semi-realistic
    negative_prompt_reason: >
      Tags de qualidade do autor, mais supressao de
      watermark/assinatura/texto e de "multiple views" (character sheet),
      modos de falha comuns quando a imagem de partida e uma splash art.
      Os termos realistic/photorealistic/3d/semi-realistic afastam a saida
      do fotorrealismo e reforcam o alvo 2D anime. Todos genericos: nenhum
      descreve uma personagem especifica.
    prompt_generic_note: >
      Termos proibidos neste prompt-base: cor de cabelo, cor de olhos,
      chifres, roupa, capa, acessorios, nome de personagem, cores
      especificas. Ha teste automatico (test_wai_benchmark.py) que falha se
      algum reaparecer. "1girl" e "solo" sao tags de composicao do dominio
      Danbooru (quantidade de figuras no quadro), nao descricao de design.

    download_gb: 10.5
    download_estimated: true
    vram_gb: 12.0
    vram_estimated: true
    vram_note: >
      SDXL fp16 ~8-10 GB, mais IP-Adapter (~1 GB) e CLIP-Vision ViT-H
      (~2.5 GB, roda no encode). Estimativa ~12 GB, ainda dentro da T4 de
      15 GB, mas com folga menor que a rota img2img. Nao medido por nos: o
      preflight do notebook mede de verdade e emite BLOCKED se nao couber.
    disk_gb: 12.0
    ram_gb: 12.0
    license: faipl-1.0-sd
    license_name: Fair AI Public License 1.0-SD
    license_link: https://freedevproject.org/faipl-1.0-sd/
    license_source: >
      Herdada do Illustrious-XL. NAO lida em fonte primaria: o Civitai esta
      bloqueado nesta sandbox. Corroborada por model cards espelho no
      HuggingFace (John6666/wai-nsfw-illustrious-*) que declaram
      license_name: faipl-1.0-sd.
    license_verified: false
    license_conflict_note: >
      O usuario observou "Commercial use allowed" na interface do Civitai.
      Isso e registrado como evidencia, mas NAO substitui o texto da licenca:
      os botoes do Civitai sao metadados preenchidos pelo autor e ja
      divergiram do LICENSE em outros modelos. A FAIPL diz que o output nao e
      coberto, mas tambem fala em proibir monetizacao proprietaria
      closed-source; a OnomaAI reconheceu a ambiguidade publicamente.
      Registrar os dois lados sem reinterpretar.
    commercial_status: pending_human_review
    commercial_banner: "Benchmark comparativo — licenca pendente de revisao humana"
    excluded_from_commercial_ranking: false
    status: MODEL_MISSING
    notes: >
      [HUMAN REVIEW REQUIRED] Nome original do projeto e
      "WAI-NSFW-illustrious-SDXL", com foco declarado em conteudo adulto. Nao
      adicionamos nenhuma tag NSFW aos prompts; registramos porque afeta o
      comportamento do modelo. Benchmark comparativo apenas: NAO e pipeline
