    download_estimated: true
    vram_gb: 16.0
    vram_estimated: true
    disk_gb: 20.0
    ram_gb: 12.0

    license: apache-2.0
    license_source: "model card oficial HF (Tongyi-MAI) + repo GitHub"
    license_verified: true
    commercial_status: verified
    third_party_quantization: false

